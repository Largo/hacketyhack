<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hackety Hack</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #1b1b1b;
        font: 14px/1.4 system-ui, sans-serif;
        color: #ddd;
      }
      #clogs-windows { display: flex; flex-wrap: wrap; gap: 12px; }
      /* Clogs paints its own everything; the canvas just has to not be blurry
         and not be scaled by the page. */
      canvas.clogs-window { background: #fff; box-shadow: 0 6px 30px #0008; outline: none; }
      #status { position: fixed; top: 8px; left: 10px; font-family: ui-monospace, monospace; opacity: .7; }
      #status[data-status="ready"] { display: none; }
    </style>
    <script src="/host.js"></script>
  </head>
  <body>
    <div id="status" data-status="booting">booting CRuby…</div>
    <div id="clogs-windows"></div>
    <script type="module" src="/dist/boot.js"></script>
    <script>
      // Mirror the Ruby side's status onto the page, so a person watching sees
      // the same thing a test asserts on.
      const status = document.getElementById("status");
      setInterval(() => {
        const value = window.__clogsStatus || "booting";
        status.dataset.status = value;
        status.textContent = value === "error" ? `error: ${window.__clogsError || ""}` : `${value}…`;
      }, 100);
    </script>
  </body>
</html>
