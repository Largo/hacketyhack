<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hackety Hack</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        /* An app is never laid out smaller than the size it declared, so a
           window narrower than that overflows on purpose -- and then it has to
           be reachable. */
        overflow: auto;
        background: #1b1b1b;
        font: 14px/1.4 system-ui, sans-serif;
        color: #ddd;
      }
      /* At least the page, and as much more as the canvas needs. host.js
         measures the viewport itself rather than this box, so growing past the
         window cannot feed back into the size it was measured against. */
      #clogs-windows {
        width: fit-content;
        height: fit-content;
        min-width: 100%;
        min-height: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      /* Clogs paints its own everything; the canvas just has to not be scaled
         by the page -- host.js sizes the backing store for the display's
         density itself. */
      canvas.clogs-window { display: block; background: #fff; outline: none; }
      #status { position: fixed; top: 8px; left: 10px; font-family: ui-monospace, monospace; opacity: .7; }

      /* `ask`, `alert` and `confirm`. These are elements rather than the
         browser's own dialogs because a page cannot count on having those --
         an embedded webview may refuse prompt() outright -- and because Ruby
         parks mid-program waiting for the answer either way. */
      .clogs-dialog-veil {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0007;
        z-index: 10;
      }
      .clogs-dialog {
        min-width: 280px;
        max-width: min(420px, 90vw);
        padding: 20px;
        border-radius: 10px;
        background: Canvas;
        color: CanvasText;
        box-shadow: 0 10px 40px #0009;
        font: 14px/1.5 system-ui, sans-serif;
      }
      .clogs-dialog-message { margin: 0 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .clogs-dialog-input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        margin-bottom: 14px;
        border: 1px solid GrayText;
        border-radius: 6px;
        background: Field;
        color: FieldText;
        font: inherit;
      }
      .clogs-dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }
      .clogs-dialog-buttons button {
        padding: 6px 16px;
        border: 1px solid GrayText;
        border-radius: 6px;
        background: ButtonFace;
        color: ButtonText;
        font: inherit;
        cursor: pointer;
      }
      .clogs-dialog-buttons .clogs-dialog-ok { border-color: transparent; background: AccentColor; color: AccentColorText; }
      #status[data-status="ready"] { display: none; }
    </style>
    <script src="/host.js"></script>
  </head>
  <body>
    <div id="status" data-status="booting">booting CRuby…</div>
    <div id="clogs-windows"></div>
    <script type="module" src="/dist/boot.js"></script>
    <script>
      // Mirror the Ruby side's status onto the page, so a person watching sees
      // the same thing a test asserts on.
      const status = document.getElementById("status");
      setInterval(() => {
        const value = window.__clogsStatus || "booting";
        status.dataset.status = value;
        status.textContent = value === "error" ? `error: ${window.__clogsError || ""}` : `${value}…`;
      }, 100);
    </script>
  </body>
</html>
