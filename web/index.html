<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hackety Hack</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: #1b1b1b;
        font: 14px/1.4 system-ui, sans-serif;
        color: #ddd;
      }
      /* A resizable Shoes window is given this whole box and lays out against
         it, so the box has to be the page. Percentages rather than vw/vh: vw
         counts the scrollbar, which would make the canvas overflow and summon
         the scrollbar it was measuring. */
      #clogs-windows {
        width: 100%;
        height: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      /* Clogs paints its own everything; the canvas just has to not be scaled
         by the page -- host.js sizes the backing store for the display's
         density itself. */
      canvas.clogs-window { display: block; background: #fff; outline: none; }
      #status { position: fixed; top: 8px; left: 10px; font-family: ui-monospace, monospace; opacity: .7; }
      #status[data-status="ready"] { display: none; }
    </style>
    <script src="/host.js"></script>
  </head>
  <body>
    <div id="status" data-status="booting">booting CRuby…</div>
    <div id="clogs-windows"></div>
    <script type="module" src="/dist/boot.js"></script>
    <script>
      // Mirror the Ruby side's status onto the page, so a person watching sees
      // the same thing a test asserts on.
      const status = document.getElementById("status");
      setInterval(() => {
        const value = window.__clogsStatus || "booting";
        status.dataset.status = value;
        status.textContent = value === "error" ? `error: ${window.__clogsError || ""}` : `${value}…`;
      }, 100);
    </script>
  </body>
</html>
