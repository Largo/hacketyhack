name: CI

on:
  push:
    branches: [master, main, clogs]
  pull_request:
  workflow_dispatch:

jobs:
  clogs:
    name: clogs (${{ matrix.os }}, ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      # libui needs GTK3 at runtime on Linux. The gem ships the libui shared
      # object itself, so only the system toolkit is needed.
      - name: Install GTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb xauth

      - name: Install dependencies
        working-directory: clogs
        run: |
          gem install bundler
          bundle install --jobs 4

      # On Linux the windowed tests run against Xvfb. On macOS and Windows the
      # runners have no interactive session, so the tests that need to open a
      # window skip themselves and the rest still run.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        working-directory: clogs
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake test

      - name: Test (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: clogs
        run: bundle exec rake test

  hacketyhack:
    name: Hackety Hack boots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb xauth

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4

      # Proves the Shoes 3 compatibility layer still loads and that the sample
      # programs Hackety Hack ships really run on Clogs.
      - name: Run the bundled Shoes samples
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake samples

      - name: Boot the IDE
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake boot

  fox:
    name: Clogs on the FOX backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # FXRuby is a C++ extension rather than a prebuilt binary, so FOX 1.6's
      # headers have to be here before bundle install. libxrandr-dev is not
      # named by the build but the link step fails without it.
      - name: Install FOX and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libfox-1.6-dev libxrandr-dev libxi-dev \
                                  libgtk-3-0 xvfb xauth

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set --local with fox
          bundle install --jobs 4

      # The point of the second backend is that it runs the same programs, so
      # it is held to the same two checks as libui rather than to a suite of
      # its own. See clogs/docs/fox_vs_libui.md.
      - name: Run the bundled Shoes samples on FOX
        env:
          CLOGS_BACKEND: fox
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake samples

      - name: Boot the IDE on FOX
        env:
          CLOGS_BACKEND: fox
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake boot

      - name: Clogs' own suite on FOX
        working-directory: clogs
        env:
          CLOGS_BACKEND: fox
        run: |
          bundle config set --local with fox
          bundle install --jobs 4
          xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake test
