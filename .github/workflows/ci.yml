name: CI

on:
  push:
    branches: [master, main, clogs]
  pull_request:
  workflow_dispatch:

jobs:
  clogs:
    name: clogs (${{ matrix.os }}, ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      # libui needs GTK3 at runtime on Linux. The gem ships the libui shared
      # object itself, so only the system toolkit is needed.
      - name: Install GTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb xauth

      - name: Install dependencies
        working-directory: clogs
        run: |
          gem install bundler
          bundle install --jobs 4

      # On Linux the windowed tests run against Xvfb. On macOS and Windows the
      # runners have no interactive session, so the tests that need to open a
      # window skip themselves and the rest still run.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        working-directory: clogs
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake test

      - name: Test (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: clogs
        run: bundle exec rake test

  hacketyhack:
    name: Hackety Hack boots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb xauth

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4

      # Proves the Shoes 3 compatibility layer still loads and that the sample
      # programs Hackety Hack ships really run on Clogs.
      - name: Run the bundled Shoes samples
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake samples

      - name: Boot the IDE
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake boot

  fox:
    name: Clogs on the FOX backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # FXRuby is a C++ extension rather than a prebuilt binary, so FOX 1.6's
      # headers have to be here before bundle install. libxrandr-dev is not
      # named by the build but the link step fails without it.
      - name: Install FOX and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libfox-1.6-dev libxrandr-dev libxi-dev \
                                  libgtk-3-0 xvfb xauth

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set --local with fox
          bundle install --jobs 4

      # The point of the second backend is that it runs the same programs, so
      # it is held to the same two checks as libui rather than to a suite of
      # its own. See clogs/docs/fox_vs_libui.md.
      - name: Run the bundled Shoes samples on FOX
        env:
          CLOGS_BACKEND: fox
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake samples

      - name: Boot the IDE on FOX
        env:
          CLOGS_BACKEND: fox
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake boot

      - name: Clogs' own suite on FOX
        working-directory: clogs
        env:
          CLOGS_BACKEND: fox
        run: |
          bundle config set --local with fox
          bundle install --jobs 4
          xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake test

  wx:
    name: Clogs on the wx backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # wxRuby3 is SWIG-generated C++ and compiles against wxWidgets 3.2's
      # headers. The webview and media packages are separate on Debian and
      # Ubuntu, and the gem does not name them, but the link step needs both.
      - name: Install wxWidgets and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwxgtk3.2-dev libwxgtk-webview3.2-dev \
                                  libwxgtk-media3.2-dev swig doxygen \
                                  libgtk-3-0 xvfb xauth

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set --local with wx
          bundle install --jobs 4

      # wxRuby3 1.8.1 does not link against a distribution's own wxWidgets:
      # `wx-config --ld` answers "g++ -o", and the gem appends its own
      # "-o target" at the end of the link line, so that leading -o swallows
      # the soname flag and no shared object is produced. See
      # clogs/docs/backends.md.
      - name: Patch wxRuby3's link flags, then build it
        run: |
          gem_dir=$(bundle show wxruby3)
          sed -i 's|@ld          = wx_config("--ld")|@ld          = wx_config("--ld").sub(/\\s+-o\\s*\\z/, "")|' \
            "$gem_dir/rakelib/lib/config/unixish.rb"
          (cd "$gem_dir" && rake -m wxruby:gem:setup)

      - name: Run the bundled Shoes samples on wx
        env:
          CLOGS_BACKEND: wx
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake samples

      - name: Boot the IDE on wx
        env:
          CLOGS_BACKEND: wx
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake boot

  qt:
    name: Clogs on the Qt backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Ruby has no maintained Qt binding, so this backend builds its own C
      # shim over Qt 6 and drives it through Fiddle. See
      # clogs/docs/backends.md.
      - name: Install Qt 6 and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgtk-3-0 xvfb xauth

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4

      - name: Build the Qt shim
        run: bundle exec rake qt:build

      - name: Run the bundled Shoes samples on Qt
        env:
          CLOGS_BACKEND: qt
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake samples

      - name: Boot the IDE on Qt
        env:
          CLOGS_BACKEND: qt
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake boot

      - name: Clogs' own suite on Qt
        working-directory: clogs
        env:
          CLOGS_BACKEND: qt
        run: |
          bundle install --jobs 4
          xvfb-run -a --server-args="-screen 0 1024x768x24" bundle exec rake test
